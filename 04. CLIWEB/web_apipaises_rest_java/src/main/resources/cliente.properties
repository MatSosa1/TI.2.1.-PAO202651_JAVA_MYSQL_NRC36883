# Conexión con el servidor REST de APIPaises.
# Cambie estos valores, recompile (mvn clean package) y vuelva a desplegar el cliente.
# (Se llama cliente.properties porque el .gitignore del repositorio excluye config.properties.)

# IP o nombre del equipo donde corre el servidor. localhost solo si está en este mismo equipo.
ws.host=localhost

# Puerto HTTP de Payara donde está desplegado el servidor.
ws.port=8080

# Context root del servidor desplegado. Los servicios están en /api.
ws.context=WS_APIPAISES_JAVA_REST
