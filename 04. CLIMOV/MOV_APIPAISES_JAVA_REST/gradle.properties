android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Servicios REST de APIPaises (termina en /api/). 10.0.2.2 es el equipo anfitrión visto desde
# el emulador; en un celular físico use la IP del servidor en la red local (p. ej. 192.168.1.20).
# También se puede indicar al compilar: gradlew assembleDebug -Pservidor=http://<IP>:8080/WS_APIPAISES_JAVA_REST/api/
servidor=http://10.0.2.2:8080/WS_APIPAISES_JAVA_REST/api/
