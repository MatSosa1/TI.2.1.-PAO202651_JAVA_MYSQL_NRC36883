plugins {
    id 'com.android.application' version '9.4.0'
}

// URL de los servicios REST. Se cambia en gradle.properties o con -Pservidor=http://<IP>:8080/WS_APIPAISES_JAVA_REST/api/
def servidor = project.findProperty('servidor') ?: 'http://10.0.2.2:8080/WS_APIPAISES_JAVA_REST/api/'

android {
    namespace = 'ec.edu.monster'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.espe.mov_apipaises_java_rest'
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'

        buildConfigField 'String', 'URL_SERVIDOR', "\"${servidor}\""
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Las pruebas viven en ec/edu/monster/pruebas, junto al código (convención del curso, igual que
    // en el cliente móvil de EurekaBank): se excluyen de la app y se compilan solo como pruebas.
    sourceSets {
        main {
            java.filter.exclude('ec/edu/monster/pruebas/**')
        }
        test {
            java.srcDir('src/main/java/ec/edu/monster/pruebas')
        }
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // JSON del servidor REST (librería que pide el taller)
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
}
