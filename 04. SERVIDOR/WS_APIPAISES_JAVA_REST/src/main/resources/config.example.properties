# Plantilla de configuración del servidor APIPaises.
# Copie este archivo como config.properties (misma carpeta) y complete la API key.
# config.properties NO se versiona (.gitignore) porque guarda la API key.
#
# Cada valor también puede venir de una propiedad del sistema (-Drestcountries.apiKey=...)
# o de una variable de entorno (RESTCOUNTRIES_APIKEY=...), que tienen prioridad.

# ----- MySQL (03. BDD/docker-compose.yml) -----
# sslMode=DISABLED: Payara presenta su certificado de cliente y MySQL lo rechaza (base local).
db.url=jdbc:mysql://localhost:3306/APIPaisesDB?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Guayaquil&sslMode=DISABLED&allowPublicKeyRetrieval=true
db.usuario=root
db.clave=12345

# ----- API REST Countries v5 (la v3.1 del ERS fue dada de baja) -----
restcountries.url=https://api.restcountries.com/countries/v5
# Cuenta gratuita en https://restcountries.com/sign-up
restcountries.apiKey=
restcountries.timeoutSegundos=15
