# Dirección del servidor REST de APIPaises.
#
# Para apuntar el cliente a otra computadora NO hace falta recompilar: edite este mismo
# archivo junto al jar (Maven lo copia a target/) y vuelva a abrir la aplicación.
# También puede indicar otro archivo con:  java -Dcliente.config=C:\ruta\cliente.properties -jar ...
#
# ws.host + ws.port + ws.context forman la URL base de los servicios:
#   http://localhost:8080/WS_APIPAISES_JAVA_REST/api
ws.host=localhost
ws.port=8080
ws.context=WS_APIPAISES_JAVA_REST
